<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NOCAP Extension</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nocap-widget">
    <div class="header">
      <div class="logo">NOCAP</div>
      <div class="version" id="versionText"></div>
    </div>
    
    <div class="status-container">
      <div class="status-text" id="statusText">판독기 작동 중</div>
      <label class="switch">
        <input type="checkbox" id="powerToggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="menu-container">
      <a href="https://nohseongmin.github.io/NOCAP-Extension/" target="_blank" class="menu-item">
        <span class="menu-icon">🌐</span> 공식 웹사이트 바로가기
      </a>
      <a href="https://nohseongmin.github.io/NOCAP-Extension/" target="_blank" class="menu-item">
        <span class="menu-icon">⭐</span> 앱 평가하기
      </a>
    </div>

    <div class="footer">
      On-device AI credibility indicator
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
